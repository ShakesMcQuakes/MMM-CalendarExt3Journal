<template id="CX3_T_POPOVER">
<div class="popover" id="CX3_POPOVER" popover="auto">
  <div class="container"></div>
  <template id="CX3_T_EVENTDETAIL">
  <div class="accent-bar"></div>
  <div class="header">
    <div class="symbol"></div>
    <div class="title"></div>
    <button class="close" popovertarget="CX3_POPOVER" popovertargetaction="hide" aria-label="Close">✕</button>
  </div>
  <div class="content">
    <dl class="criteria"></dl>
    <template id="CX3_T_CRITERIA">
      <div class="criteriaItem">
        <dt class="name"></dt>
        <dd class="value"></dd>
      </div>
    </template>
  </div>
  </template>
</div>
</template>
